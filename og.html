<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Javier Munoz, CFE — share image</title>
<meta name="robots" content="noindex">
<style>
  @font-face{font-family:Inter;font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/inter-latin.woff2) format("woff2")}
  @font-face{font-family:Inter;font-style:italic;font-weight:400 700;font-display:swap;src:url(fonts/inter-latin-italic.woff2) format("woff2")}
  /* Source of og.png (1200×630), the link preview for LinkedIn, WhatsApp and others. */
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;background:#F5F6F8;font-family:Inter,Arial,sans-serif;color:#0E1726;overflow:hidden}
  .f{position:absolute;inset:56px 72px;display:grid;grid-template-columns:1fr 250px;grid-template-rows:auto 1fr auto;column-gap:56px}
  .rule{grid-column:1/-1;border-top:3px solid #0E1726;padding-top:14px;display:flex;justify-content:space-between;font:600 15px Inter;letter-spacing:.12em;text-transform:uppercase;color:#1B3A6B}
  .rule span:last-child{color:#5B6675}
  .txt{align-self:center}
  h1{font:700 84px/1 Inter;letter-spacing:-.025em}
  .role{font:600 20px Inter;letter-spacing:.12em;text-transform:uppercase;color:#1B3A6B;margin-top:22px}
  .sub{font:italic 400 28px/1.3 Inter;color:#1B3A6B;margin-top:14px}
  .seal{align-self:center;width:250px;height:250px;border-radius:50%;overflow:hidden;filter:grayscale(1);box-shadow:0 0 0 1px #C3CAD5,0 0 0 12px #F5F6F8,0 0 0 13px #D6DBE3}
  .seal img{width:100%;height:100%;object-fit:cover;object-position:center 15%}
  .figs{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .figs div{background:#fff;border:1px solid #D6DBE3;border-top:3px solid #0E1726;padding:14px 18px}
  .figs b{display:block;font:700 34px/1.1 Inter}
  .figs b.hl{color:#2F6FED}
  .figs span{display:block;font-size:16px;color:#5B6675;margin-top:4px}
</style>
</head>
<body>
<div class="f">
  <div class="rule"><span>CFE · Chief Financial Officer · APAC</span><span>cosmopolitanem.github.io/portfolio</span></div>
  <div class="txt">
    <h1>Javier Munoz</h1>
    <p class="sub">10+ years of finance leadership. Capital, turnarounds and an AI-first finance function.</p>
  </div>
  <div class="seal"><img src="javier.png" alt=""></div>
  <div class="figs">
    <div><b>10+</b><span>Years leading finance</span></div>
    <div><b>US$200M+</b><span>Assets managed today</span></div>
    <div><b class="hl">+4,500%</b><span>EBT growth, turnaround</span></div>
    <div><b>4+</b><span>Acquisitions completed</span></div>
  </div>
</div>
</body>
</html>
